<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizaciones — Taller Bobadilla</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;font-family:'Barlow',Arial,sans-serif}

/* ── CLIENT BAR ── */
#client-bar{display:flex;align-items:center;background:#060d18;border-bottom:2px solid #0f1828;height:48px;flex-shrink:0;padding:0 14px;gap:10px;z-index:10}
.cb-brand{font-size:11px;font-weight:700;letter-spacing:2px;color:#f97316;text-transform:uppercase;white-space:nowrap}
.cb-sep{width:1px;height:24px;background:#1e2d45;flex-shrink:0}
.client-tabs{display:flex;gap:2px;flex:1;overflow:hidden}
.ctab{padding:6px 14px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:3px;color:#5a6a82;transition:background .2s,color .2s;border:1px solid transparent;white-space:nowrap}
.ctab:hover{color:#d1d5db;background:#111827}
.ctab.on{color:#fff;background:#1e2d45;border-color:#2d4060}
.ctab.on.c0{border-left:3px solid #e31837}
.ctab.on.c1{border-left:3px solid #005f9e}
.ctab.on.c2{border-left:3px solid #e8860a}
.ctab.on.c3{border-left:3px solid #16a34a}
.ctab.on.c4{border-left:3px solid #7c3d1e}
.cb-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.cb-back{font-size:10px;color:#5a6a82;text-decoration:none;letter-spacing:1px;transition:color .2s}
.cb-back:hover{color:#f97316}
.cb-logout{background:transparent;border:1px solid #1e2d45;border-radius:3px;color:#5a6a82;padding:4px 10px;font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .2s;font-family:inherit;text-transform:uppercase}
.cb-logout:hover{border-color:#f97316;color:#f97316}

/* ── MAIN ── */
#main{display:flex;flex:1;overflow:hidden}

/* ── EDITOR ── */
#editor{width:360px;min-width:300px;background:#111827;color:#d1d5db;display:flex;flex-direction:column;flex-shrink:0;border-right:2px solid #f97316}
#ed-hd{padding:10px 14px 0;flex-shrink:0}
.brand{font-size:9px;font-weight:700;letter-spacing:2px;color:#f97316;text-transform:uppercase;margin-bottom:2px}
#sync-st{font-size:9px;color:#4b5563;margin-bottom:7px;letter-spacing:.5px}
#sync-st.ok{color:#16a34a}
#sync-st.ing{color:#f97316}
#sync-st.err{color:#dc2626}
.tabs{display:flex;border-bottom:1px solid #1f2937;margin:0 -14px;padding:0 14px}
.tab{padding:7px 10px;font-size:10px;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;color:#4b5563;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:#f97316;border-bottom-color:#f97316}
.tab:hover:not(.on){color:#9ca3af}
.tc{display:none;flex:1;overflow-y:auto;padding:10px 14px}
.tc.on{display:block}

/* Campos */
.fg{margin-bottom:9px}
.fl{font-size:9px;letter-spacing:1.2px;color:#4b5563;text-transform:uppercase;margin-bottom:3px}
.fi{width:100%;background:#1f2937;border:1px solid #374151;border-radius:3px;color:#d1d5db;padding:5px 8px;font-size:13px;outline:none}
.fi:focus{border-color:#f97316}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.logo-box{border:1px dashed #374151;border-radius:4px;padding:8px;text-align:center;cursor:pointer;margin-bottom:9px;position:relative;min-height:54px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px}
.logo-box:hover{border-color:#f97316}
.logo-box input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.logo-ph{font-size:10px;color:#4b5563;pointer-events:none}
.cot-row{display:flex;gap:4px}
.cot-row .fi{flex:1}
.cot-btn{background:#1f2937;border:1px solid #374151;border-radius:3px;color:#9ca3af;padding:5px 9px;font-size:12px;cursor:pointer}
.cot-btn:hover{border-color:#f97316;color:#f97316}
.sec{font-size:9px;letter-spacing:1.2px;color:#4b5563;text-transform:uppercase;margin:6px 0 5px;border-top:1px solid #1f2937;padding-top:8px}
/* Doc type toggle */
.dtype-wrap{display:flex;gap:3px;background:#0a1020;border-radius:4px;padding:3px;margin-bottom:12px}
.dtype-btn{flex:1;padding:7px 8px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:3px;border:none;background:transparent;color:#4b5563;font-family:inherit;transition:all .2s}
.dtype-btn:hover:not(.on){color:#9ca3af;background:#1f2937}
.dtype-btn.on.cot{background:#f97316;color:#fff}
.dtype-btn.on.rep{background:#3b82f6;color:#fff}

/* Items cotización */
.ihead{display:grid;grid-template-columns:15px 1fr 48px 68px 68px 20px;gap:3px;margin-bottom:3px}
.ihl{font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:#374151;text-align:center}
.ihl:nth-child(2){text-align:left}
.irow{display:grid;grid-template-columns:15px 1fr 48px 68px 68px 20px;gap:3px;margin-bottom:2px;align-items:center}
.inum{font-size:9px;color:#374151;text-align:right}
.ri{width:100%;background:#1f2937;border:1px solid #374151;border-radius:2px;color:#d1d5db;padding:3px 5px;font-size:12px;outline:none}
.ri:focus{border-color:#f97316}
.ri-r{text-align:right}
.isub{font-size:10px;color:#f97316;text-align:right;padding:0 2px;white-space:nowrap}
.irem{font-size:14px;color:#374151;cursor:pointer;text-align:center;line-height:1;padding:2px;user-select:none}
.irem:hover{color:#ef4444}
.tbar{display:flex;justify-content:space-between;align-items:center;background:#1f2937;border-radius:3px;padding:6px 10px;margin-top:6px}
.tbar-l{font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:.8px}
.tbar-v{font-size:16px;font-weight:700;color:#f97316}
.add-btn{width:100%;background:transparent;border:1px dashed #374151;border-radius:3px;color:#4b5563;padding:5px;font-size:11px;cursor:pointer;margin-top:4px}
.add-btn:hover{border-color:#f97316;color:#f97316}
/* Reporte / Maderera textareas */
.rep-ta{width:100%;background:#1f2937;border:1px solid #374151;border-radius:3px;color:#d1d5db;padding:7px 9px;font-size:12px;outline:none;font-family:'Barlow',Arial,sans-serif;resize:none;line-height:1.6;min-height:100px}
.rep-ta:focus{border-color:#3b82f6}
.rep-ta.mad{min-height:80px}
.rep-ta.mad:focus{border-color:#7c3d1e}
.rep-info{font-size:9px;color:#374151;text-align:right;margin-top:3px}
/* Maderera item in editor */
.mad-item-block{background:#1a2338;border:1px solid #252f44;border-radius:4px;padding:10px;margin-bottom:8px}
.mad-item-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.mad-item-lbl{font-size:9px;font-weight:700;letter-spacing:1px;color:#f97316;text-transform:uppercase}

/* Borradores */
.dbrow{display:flex;gap:5px;margin-bottom:5px}
.db{flex:1;background:#1f2937;border:1px solid #374151;border-radius:3px;color:#9ca3af;padding:6px;font-size:10px;cursor:pointer;text-align:center}
.db:hover{border-color:#f97316;color:#f97316}
.db.pri{background:#f97316;border-color:#f97316;color:#fff;font-weight:700}
.db.pri:hover{background:#e06010}
.ditem{background:#1f2937;border:1px solid #374151;border-radius:3px;padding:6px 9px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.ditem:hover{border-color:#f97316}
.dname{font-size:11px;font-weight:700;color:#d1d5db}
.ddate{font-size:9px;color:#4b5563;margin-top:1px}
.dtype-badge{font-size:8px;padding:1px 5px;border-radius:2px;font-weight:700;margin-left:5px}
.dtype-badge.cot{background:rgba(249,115,22,.15);color:#f97316}
.dtype-badge.rep{background:rgba(59,130,246,.15);color:#3b82f6}
.dtype-badge.mad{background:rgba(124,61,30,.2);color:#c07040}
.ddel{font-size:16px;color:#374151;cursor:pointer;padding:0 3px;line-height:1}
.ddel:hover{color:#ef4444}
.no-d{font-size:11px;color:#374151;text-align:center;padding:12px 0}

/* Acciones */
#ed-foot{padding:10px 14px;border-top:1px solid #1f2937;display:flex;gap:6px;flex-shrink:0}
.bpr{flex:1;color:#fff;border:none;border-radius:4px;padding:9px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.8px;font-family:inherit;transition:background .2s}
.bpr.cot{background:#f97316}.bpr.cot:hover{background:#e06010}
.bpr.rep{background:#3b82f6}.bpr.rep:hover{background:#2563eb}
.bpr.mad{background:#7c3d1e}.bpr.mad:hover{background:#5c2d14}
.bnw{background:#1f2937;color:#9ca3af;border:1px solid #374151;border-radius:4px;padding:9px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.bnw:hover{color:#d1d5db;background:#374151}

/* Toast / Loading */
#toast{position:fixed;bottom:12px;right:12px;color:#fff;padding:7px 14px;border-radius:4px;font-size:12px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999}
#toast.show{opacity:1}
#loading{position:fixed;inset:0;background:rgba(8,14,26,.85);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:10px;transition:opacity .3s}
#loading.hide{opacity:0;pointer-events:none}
.ld-spin{width:28px;height:28px;border:3px solid #1f2937;border-top-color:#f97316;border-radius:50%;animation:spin .8s linear infinite}
.ld-txt{font-size:11px;color:#4b5563;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── PREVIEW ── */
#pvw{flex:1;background:#888;overflow:auto;padding:20px;display:flex;flex-direction:column;align-items:center}

/* Documento Bobadilla */
.doc{background:#fff;width:680px;min-width:680px;min-height:960px;padding:14px 20px;box-shadow:0 3px 18px rgba(0,0,0,.3);font-family:Arial,sans-serif}
.dhead{display:flex;align-items:center;margin-bottom:6px}
.dlogw{width:141px;min-width:141px;min-height:107px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dlogw img{max-width:141px;max-height:107px;object-fit:contain}
.dtitle{flex:1;text-align:center}
.dt1{font-size:11px;font-weight:700;text-transform:uppercase}
.dt2{font-size:15px;font-weight:900;text-transform:uppercase}
.dt3{font-size:9px}
.dfr{display:flex;justify-content:flex-end;border:1px solid #333;border-bottom:none}
.dfc{padding:2px 5px;font-size:9px;font-weight:700;border-left:1px solid #333}
.dval{font-weight:400}
.dclir{display:grid;grid-template-columns:2fr 1fr 1.4fr 1.2fr;border:1px solid #333}
.dcell{padding:2px 4px;border-right:1px solid #333;font-size:9px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dcell:last-child{border-right:none}
.dloc{border:1px solid #333;border-top:none;padding:2px 4px;font-weight:700;font-size:9px;margin-bottom:3px}
.dtbl{width:100%;border-collapse:collapse;margin-bottom:3px;font-size:9px;table-layout:fixed}
.dtbl th{background:#f0f0f0;border:1px solid #555;padding:2px 4px;font-size:8px;text-transform:uppercase;text-align:left}
.dtbl th.r,.dtbl td.r{text-align:right}
.dtbl td{border:1px solid #ddd;padding:2px 4px;min-height:18px}
.trow td{border-top:2px solid #333;background:#f5f5f5;font-weight:700;font-size:10px}
.rep-titulo-doc{border:1px solid #333;border-bottom:none;padding:4px 6px;font-size:10px;font-weight:700}
.rep-body-doc{border:1px solid #333;padding:8px 10px;font-size:10px;line-height:1.8;min-height:500px;white-space:pre-wrap;word-wrap:break-word;margin-bottom:3px}
.dftr{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid #333;margin-bottom:3px}
.dft-ot{padding:3px 6px;border-right:1px solid #333;font-size:10px}
.dft-cr{padding:3px 6px;border-right:1px solid #333;font-size:10px}
.dft-tot{padding:3px 6px;text-align:right;font-weight:700;font-size:10px}
.dsigs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:20px;margin-bottom:6px}
.dsig{text-align:center;border-top:1px solid #333;padding-top:3px;font-size:9px;color:#555}
.dcontact{text-align:center;font-size:10px;font-weight:700;margin-top:7px;padding-top:5px;border-top:1px solid #eee}

/* Documento Maderera */
.mad-doc{background:#fff;width:680px;min-width:680px;min-height:900px;padding:40px 48px 0;box-shadow:0 3px 18px rgba(0,0,0,.3);font-family:Georgia,'Times New Roman',serif;font-size:12px;line-height:1.6;color:#1a1a1a}
.mad-logo-area{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.mad-logo-name{font-family:Georgia,serif;font-size:26px;letter-spacing:3px;color:#1a1a1a;font-weight:400}
.mad-date{margin-bottom:24px;font-size:13px}
.mad-recipient{margin-bottom:20px;font-size:13px;line-height:1.5}
.mad-saludo{margin-bottom:16px;font-size:13px}
.mad-intro{margin-bottom:24px;font-size:13px;line-height:1.7}
.mad-item{display:flex;gap:20px;margin-bottom:20px;align-items:flex-end}
.mad-item-left{flex:1;min-width:0}
.mad-item-title{font-weight:700;font-size:13px;margin-bottom:4px}
.mad-item-desc{font-size:13px;line-height:1.65}
.mad-item-price{min-width:80px;text-align:right;font-size:13px;flex-shrink:0;padding-bottom:1px}
.mad-closing{margin:20px 0;font-size:13px;line-height:1.7}
.mad-closing p{margin-bottom:10px}
.mad-firma-area{margin:28px 0 16px;font-size:13px}
.mad-firma-word{letter-spacing:4px;font-size:12px;margin-bottom:12px}
.mad-firma-script{font-family:cursive;font-size:22px;margin:8px 0;color:#1a1a1a;opacity:.7}
.mad-firma-line{width:160px;border-top:1px solid #1a1a1a;margin:20px 0 6px}
.mad-firma-nombre{font-size:13px;font-weight:700}
.mad-bank-box{float:right;border:1px solid #888;padding:12px 14px;font-size:10px;line-height:1.6;margin-top:-90px;width:210px;font-family:Georgia,serif}
.mad-bank-title{font-weight:700;font-size:10px;margin-bottom:6px}
.mad-bank-row{display:flex;gap:4px;font-size:10px;flex-wrap:wrap}
.mad-bank-label{font-weight:700}
.mad-precios-note{font-size:11px;clear:both;margin:16px 0 0;font-style:italic;font-family:Georgia,serif}
.mad-footer{background:#5c2d14;color:#e8d5c4;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;margin:20px -48px 0;font-size:11px;gap:20px;font-family:Georgia,serif}
.mad-footer-left{display:flex;flex-direction:column;gap:5px}
.mad-footer-item{display:flex;align-items:center;gap:7px;opacity:.9}
.mad-footer-right{display:flex;align-items:center;gap:8px;white-space:nowrap}
.mad-footer-brand{font-family:Georgia,serif;font-size:14px;letter-spacing:2px;color:#e8d5c4}

@media print{
  @page{size:letter portrait;margin:12mm}
  html,body,#app{height:auto;overflow:visible;display:block}
  #client-bar,#editor,#loading{display:none!important}
  #main{display:block}
  #pvw{padding:0;background:none;overflow:visible;display:block}
  .doc,.mad-doc{box-shadow:none;width:100%;min-width:unset;min-height:unset}
  .doc{padding:0}
  .mad-doc{padding:8mm 12mm 0}
  .mad-footer{margin:20px -48px 0}
  .dftr,.dsigs,.dcontact{page-break-inside:avoid}
  .mad-firma-area,.mad-bank-box,.mad-footer{page-break-inside:avoid}
}
</style>
</head>
<body>

<div id="app">
  <!-- CLIENT BAR -->
  <div id="client-bar">
    <div class="cb-brand">Bobadilla</div>
    <div class="cb-sep"></div>
    <div class="client-tabs">
      <div class="ctab c0 on" data-c="0">CEMEX</div>
      <div class="ctab c1"    data-c="1">HOLCIM</div>
      <div class="ctab c2"    data-c="2">C. ESPAÑOLES</div>
      <div class="ctab c3"    data-c="3">HOLCIM ES</div>
      <div class="ctab c4"    data-c="4">MADERERA</div>
    </div>
    <div class="cb-right">
      <a href="../" class="cb-back">← Inicio</a>
      <button class="cb-logout" id="btn-logout">Salir</button>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="editor">
      <div id="ed-hd">
        <div class="brand" id="ed-client-name">✦ CEMEX</div>
        <div id="sync-st">↻ Cargando…</div>
        <div class="tabs">
          <div class="tab on" data-t="datos">📋 Datos</div>
          <div class="tab" data-t="trab" id="tab-trab">🔧 Trabajos</div>
          <div class="tab" data-t="bor">💾 Borradores</div>
        </div>
      </div>

      <div class="tc on" data-t="datos"><div id="datos-ed"></div></div>
      <div class="tc" data-t="trab"><div id="items-ed"></div></div>

      <div class="tc" data-t="bor">
        <div class="dbrow">
          <button class="db pri" id="btn-save">💾 Guardar</button>
          <button class="db" id="btn-del-all">🗑 Limpiar todo</button>
        </div>
        <div class="fl" style="margin-bottom:5px">Documentos guardados</div>
        <div id="draft-list"><div class="no-d">No hay borradores</div></div>
      </div>

      <div id="ed-foot">
        <button class="bnw" id="btn-new">+ Nuevo</button>
        <button class="bpr cot" id="btn-print" onclick="window.print()">⎙ Imprimir / PDF</button>
      </div>
    </div>

    <div id="pvw"></div>
  </div>
</div>

<div id="loading"><div class="ld-spin"></div><div class="ld-txt">Conectando…</div></div>
<div id="toast"></div>

<script>
// ── AUTH ──
if (!sessionStorage.getItem('bob_auth')) window.location.replace('../');

// ── CLIENTES ──
const CLIENTS = [
  {id:'cemex',    label:'CEMEX',              tab:'CEMEX',        crLabel:'CR'},
  {id:'holcim',   label:'HOLCIM',             tab:'HOLCIM',       crLabel:'RE'},
  {id:'cemex2',   label:'Cementos Españoles', tab:'C. ESPAÑOLES', crLabel:'BP'},
  {id:'cemex3',   label:'Holcim ES',          tab:'HOLCIM ES',    crLabel:'RE'},
  {id:'maderera', label:'Maderera',           tab:'MADERERA',     crLabel:''},
];

// ── MADERERA FIXED DATA ──
const MAD = {
  dir:   'Miguel Ocaranza 97b, Merced Gómez, C.P: 01600, CDMX',
  email: 'contacto@maderera.mx',
  tel:   '55 5660 5215',
  web:   'maderera.mx',
  banco: 'BBVA',
  nombre:'Mixteca Exotic Woods, S.A. de C.V.',
  clabe: '012180001262384329',
  cuenta:'0126238432',
  mail:  'margarita@comercialmaderera.com',
  cierre:[
    'Nuestros precios son por metro cuadrado o lineal colocados e incluyen mermas.',
    'Estos precios son con IVA incluido y la forma de pago es del 75% de anticipo y el saldo al concluir los trabajos.',
    'Sin otro particular al respecto nos es muy grato quedar de usted a sus apreciables órdenes.'
  ]
};

// ── BLOB ──
const BLOB_BASE = 'https://kanbandevopsgz.blob.core.windows.net/cotizador-data/';
const SAS = '?sv=2026-02-06&ss=b&srt=o&sp=rwdctfx&se=2027-05-28T07:57:22Z&st=2026-05-27T23:42:22Z&spr=https&sig=a2giTv7vGbpRyCxLlgboG1RbuGlWdBLLtBF9BLaFaec%3D';
function blobUrl(){ return BLOB_BASE + CLIENTS[activeIdx].id + '-state.json' + SAS; }

// ── ESTADO ──
let activeIdx = 0;
let S = freshState();

function freshState(){
  return {
    logoB64:null, docType:'cotizacion',
    fecha:todayS(), cot:'0001', cli:'', prov:'', ubi:'', ot:'', cr:'',
    rows:initRows(15), counter:1,
    rep:'0001', reporteTitulo:'', reporteTexto:'', reporteCounter:1,
    madNum:'0001', madCounter:1,
    madDest:'', madTrat:'Estimada/o', madProyecto:'', madFirmante:'',
    madItems:[freshMadItem()],
    drafts:[]
  };
}
function freshMadItem(){ return {titulo:'',descripcion:'',precio:''}; }

function eRow(){ return {d:'',q:'',p:''}; }
function initRows(n){ return Array(n).fill(0).map(eRow); }
function todayS(){ return new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmt(n){ const v=parseFloat((''+(n||'')).replace(/[$,]/g,'')); if(isNaN(v)||v===0)return ''; return '$'+v.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pn(s){ const n=parseFloat((''+(s||'')).replace(/[$,\s]/g,'')); return isNaN(n)?0:n; }
function rSub(r){ const q=pn(r.q),p=pn(r.p); return q>0&&p>0?q*p:0; }
function gTotal(){ return S.rows.reduce((a,r)=>a+rSub(r),0); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function isMad(){ return activeIdx===4; }
function isCot(){ return S.docType==='cotizacion'; }
function crLbl(){ return CLIENTS[activeIdx].crLabel; }

// ── CACHE ──
function cacheKey(){ return 'bob_cache_'+CLIENTS[activeIdx].id; }
function cacheRead(){ try{const v=localStorage.getItem(cacheKey());return v?JSON.parse(v):null;}catch{return null;} }
function cacheWrite(d){ try{localStorage.setItem(cacheKey(),JSON.stringify(d));}catch{} }

// ── BLOB OPS ──
async function blobRead(){
  const res=await fetch(blobUrl());
  if(res.status===404)return null;
  if(!res.ok)throw new Error('HTTP '+res.status);
  return await res.json();
}
async function blobWrite(data){
  const res=await fetch(blobUrl(),{method:'PUT',headers:{'x-ms-blob-type':'BlockBlob','Content-Type':'application/json'},body:JSON.stringify(data)});
  if(!res.ok)throw new Error('HTTP '+res.status);
}
function getBlob(){ return {counter:S.counter,reporteCounter:S.reporteCounter,madCounter:S.madCounter,drafts:S.drafts,logo:S.logoB64}; }

// ── SYNC ──
function syncSt(st){ const el=document.getElementById('sync-st'); if(!el)return; el.className=st; el.textContent=st==='ok'?'☁ Sincronizado':st==='ing'?'↻ Guardando…':'⚠ Sin conexión'; }
async function saveAll(){ syncSt('ing'); try{ await blobWrite(getBlob()); cacheWrite(getBlob()); syncSt('ok'); return true; }catch(e){ syncSt('err'); return false; } }

// ── TOAST / LOADING ──
function toast(m,e){ const t=document.getElementById('toast'); t.textContent=m; t.style.background=e?'#dc2626':'#16a34a'; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2300); }
function showLoading(v){ const l=document.getElementById('loading'); if(v){l.classList.remove('hide');l.style.display='';}else{l.classList.add('hide');setTimeout(()=>l.style.display='none',350);} }

// ── TABS ──
function swTab(n){ document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===n)); document.querySelectorAll('.tc').forEach(c=>c.classList.toggle('on',c.dataset.t===n)); }

// ── DOC TYPE ──
function swDocType(dt){
  S.docType=dt;
  document.querySelectorAll('.dtype-btn').forEach(b=>b.classList.toggle('on',b.dataset.dt===dt));
  const tt=document.getElementById('tab-trab'); if(tt) tt.textContent=isCot()?'🔧 Trabajos':'📝 Reporte';
  const bp=document.getElementById('btn-print'); if(bp) bp.className='bpr '+(isCot()?'cot':'rep');
  buildContent(); rPreview();
}

          <input class="fi ri-r" style="width:130px" data-mf="precio" data-mi="${i}" value="${esc(item.precio)}" placeholder="0.00">

    });
    h+=`<button class="add-btn" id="add-mad-item" style="border-color:#7c3d1e;color:#7c3d1e">+ Agregar ítem</button>`;
    c.innerHTML=h;
    c.querySelectorAll('input[data-mf],textarea[data-mf]').forEach(el=>{

      const i=parseInt(ev.target.dataset.mi); if(S.madItems.length<=1){toast('Mínimo 1 ítem',true);return;}

    return;

  if(!isCot()){
    if(tt) tt.textContent='📝 Reporte';
    const bp=document.getElementById('btn-print'); if(bp) bp.className='bpr rep';
    c.innerHTML=`
      <div class="fg"><div class="fl">Título / Asunto</div><input class="fi" id="rep-titulo" value="${esc(S.reporteTitulo)}" placeholder="Ej: Transmisión Fotón Gen 1"></div>

      </div>`;
    document.getElementById('rep-titulo').addEventListener('input',e=>{S.reporteTitulo=e.target.value;rPreview();});

      S.reporteTexto=e.target.value;
      const ch=document.getElementById('rep-chars'); if(ch)ch.textContent=e.target.value.length+' caracteres';

      const gt=gTotal(); const et=document.getElementById('ed-tot'); if(et)et.textContent=gt>0?fmt(gt):'—';
      rPreview();
    });
  });
  c.querySelectorAll('.irem').forEach(btn=>btn.addEventListener('click',ev=>{
    const i=parseInt(ev.target.dataset.ri); if(S.rows.length<=1){toast('Mínimo 1 renglón',true);return;}
    S.rows.splice(i,1);buildContent();rPreview();
  }));
  const addBtn=document.getElementById('add-row');
  if(addBtn) addBtn.addEventListener('click',()=>{ S.rows.push(eRow());buildContent();rPreview(); const tc=c.closest('.tc');if(tc)tc.scrollTop=tc.scrollHeight; });
}

    itemsHtml+=`<div class="mad-item">

// ── BORRADORES ──
function rDrafts(){
  const c=document.getElementById('draft-list'); if(!c)return;
  if(!S.drafts.length){c.innerHTML='<div class="no-d">No hay documentos guardados</div>';return;}
  c.innerHTML=S.drafts.map(d=>{
    const dt=d.data&&d.data.docType;
    const m=d.data&&d.data.madNum;
    const badge=m?'<span class="dtype-badge mad">PRES</span>':dt==='reporte'?'<span class="dtype-badge rep">REP</span>':'<span class="dtype-badge cot">COT</span>';
    return `<div class="ditem" data-id="${d.id}">
      <div><div class="dname">${esc(d.name)}${badge}</div><div class="ddate">${d.date}</div></div>
      <span class="ddel" data-id="${d.id}">×</span>
    </div>`;
  }).join('');
  c.querySelectorAll('.ditem').forEach(el=>{
    el.addEventListener('click',()=>loadDraft(S.drafts.find(d=>d.id===el.dataset.id)));
    el.querySelector('.ddel').addEventListener('click',e=>{e.stopPropagation();delDraft(el.dataset.id);});
  });
}

async function saveDraft(){
  let prefix,num,desc;
  if(isMad()){prefix='PRES';num=S.madNum;desc=S.madDest||S.madProyecto;}
  else if(isCot()){prefix='COT';num=S.cot;desc=S.cli;}
  else{prefix='REP';num=S.rep;desc=S.cli;}
  const name=`${prefix}-${num}${desc?' — '+desc:''}`;
  const now=new Date();
  const date=now.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  S.drafts.unshift({id:'d'+Date.now(),name,date,data:JSON.parse(JSON.stringify({...S,logoB64:null,drafts:[]}))});
  if(S.drafts.length>50)S.drafts=S.drafts.slice(0,50);
  rDrafts();
  const ok=await saveAll();
  toast(ok?'✓ Guardado en la nube':'✓ Guardado (sin conexión)',!ok);
}

function loadDraft(d){
  if(!d)return;
  const x=d.data;
  Object.assign(S,{
    docType:x.docType||'cotizacion',
    fecha:x.fecha||todayS(),cot:x.cot||'0001',cli:x.cli||'',
    prov:x.prov||'',ubi:x.ubi||'',ot:x.ot||'',cr:x.cr||'',
    rows:x.rows||initRows(15),
    rep:x.rep||'0001',reporteTitulo:x.reporteTitulo||'',reporteTexto:x.reporteTexto||'',
    madNum:x.madNum||'0001',madDest:x.madDest||'',madTrat:x.madTrat||'Estimada/o',
    madProyecto:x.madProyecto||'',madFirmante:x.madFirmante||'',
    madItems:x.madItems||[freshMadItem()],
  });
  buildDatos();buildContent();rPreview();swTab('datos');toast('✓ Documento cargado');
}

async function delDraft(id){
  S.drafts=S.drafts.filter(d=>d.id!==id);
  rDrafts();await saveAll();toast('Documento eliminado');
}

// ── NUEVO ──
async function newDoc(){
  if(isMad()){
    S.madCounter++;S.madNum=String(S.madCounter).padStart(4,'0');
    S.fecha=todayS();S.madDest='';S.madTrat='Estimada/o';S.madProyecto='';S.madFirmante='';
    S.madItems=[freshMadItem()];
  } else if(isCot()){
    S.counter++;S.cot=String(S.counter).padStart(4,'0');
    S.fecha=todayS();S.cli='';S.prov='';S.ubi='';S.ot='';S.cr='';S.rows=initRows(15);
  } else {
    S.reporteCounter++;S.rep=String(S.reporteCounter).padStart(4,'0');
    S.fecha=todayS();S.cli='';S.prov='';S.ubi='';S.ot='';S.cr='';
    S.reporteTitulo='';S.reporteTexto='';
  }
  buildDatos();buildContent();rPreview();swTab('datos');await saveAll();
  const prefix=isMad()?'PRES':isCot()?'COT':'REP';
  const num=isMad()?S.madNum:isCot()?S.cot:S.rep;
  toast(`✓ Nuevo ${prefix}-${num}`);
}

// ── LOAD FROM BLOB ──
async function loadClientFromBlob(){
  let loaded=false;
  try{
    const data=await blobRead();
    if(data){
      S.counter=data.counter||1;S.reporteCounter=data.reporteCounter||1;
      S.madCounter=data.madCounter||1;S.drafts=data.drafts||[];S.logoB64=data.logo||null;
      cacheWrite(data);loaded=true;
    }
  }catch(e){console.warn(e);}
  if(!loaded){
    const cache=cacheRead();
    if(cache){S.counter=cache.counter||1;S.reporteCounter=cache.reporteCounter||1;S.madCounter=cache.madCounter||1;S.drafts=cache.drafts||[];S.logoB64=cache.logo||null;}
    syncSt('err');
  }else{syncSt('ok');}
  S.cot=String(S.counter).padStart(4,'0');
  S.rep=String(S.reporteCounter).padStart(4,'0');
  S.madNum=String(S.madCounter).padStart(4,'0');
}

// ── SWITCH CLIENT ──
async function switchClient(idx){
  if(idx===activeIdx)return;
  showLoading(true);
  await saveAll();
  activeIdx=idx;S=freshState();
  await loadClientFromBlob();
  buildDatos();buildContent();rPreview();rDrafts();
  document.querySelectorAll('.ctab').forEach(t=>t.classList.toggle('on',parseInt(t.dataset.c)===idx));
  document.getElementById('ed-client-name').textContent='✦ '+CLIENTS[idx].label;
  showLoading(false);
}

// ── INIT ──
async function init(){
  showLoading(true);
  S=freshState();
  await loadClientFromBlob();
  buildDatos();buildContent();rPreview();rDrafts();

  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>swTab(t.dataset.t)));
  document.querySelectorAll('.ctab').forEach(t=>t.addEventListener('click',()=>switchClient(parseInt(t.dataset.c))));
  document.getElementById('btn-save').addEventListener('click',saveDraft);
  document.getElementById('btn-del-all').addEventListener('click',async()=>{
    if(!confirm('¿Eliminar todos los documentos de '+CLIENTS[activeIdx].label+'?'))return;
    S.drafts=[];rDrafts();await saveAll();toast('Documentos eliminados');
  });
  document.getElementById('btn-new').addEventListener('click',newDoc);
  document.getElementById('btn-logout').addEventListener('click',()=>{sessionStorage.removeItem('bob_auth');window.location.replace('../');});

  document.getElementById('ed-client-name').textContent='✦ '+CLIENTS[0].label;
  showLoading(false);
}

init();
</script>
